    /* Landscape: copy on the left, chart on the right; only the end card swaps (copy 55–86% of the width) */

  <script>
    (function () {
      const C = window.EM_CONTENT;
      const set = (id, txt) => {
        const n = document.getElementById(id);
        if (n) n.textContent = txt;
      };
      const ins = C.insights;
      set("b0-kicker", C.kicker);
      set("b0-period", C.period);
      set("b0-title", C.title);
      set("b0-dek", C.dek);
      set("b0-lab", ins[0].label);
      
      
      for (let i = 1; i <= 4; i++) {
        set(`b${i}-lab`, ins[i].label);
        set(`b${i}-val`, ins[i].value);
        set(`b${i}-line`, ins[i].line);
        set(`b${i}-note`, ins[i].note);
      }
      
      
      set("b5-title", C.title);
      set("b5-site", C.site.replace(/^https?:\/\//, "").replace(/\/$/, ""));
      set("b5-src", C.source_line + ". " + C.notes.join(" "));

      // Site motion, in time instead of scroll (site/shared/craft.js):
      //  - kinetic lines on title, dek, value and line: masked lines rise in, staggered across 0.62 of the window
      //  - cue on meta, label, note, site: opacity + 2.4 vh rise
      // Out: lines rise out through their masks, cues fade. Nothing moves while it is being read.
      const T = [6.0, 13.2, 20.4, 27.6, 34.8];
      const blocks = Array.from(document.getElementById("copy-page").children);
      function splitLines(el) {
        const words = el.textContent.trim().split(/\s+/);
        el.textContent = "";
        const spans = words.map((w, i) => {
          const sp = document.createElement("span");
          sp.textContent = w + (i < words.length - 1 ? " " : "");
          el.appendChild(sp);
          return sp;
        });
        const rows = [];
        spans.forEach((sp) => {
          const top = sp.offsetTop;
          const last = rows[rows.length - 1];
          if (last && Math.abs(last.top - top) < 4) last.words.push(sp.textContent);
          else rows.push({ top, words: [sp.textContent] });
        });
        el.textContent = "";
        return rows.map((r) => {
          const line = document.createElement("span"),
            inner = document.createElement("span");
          line.className = "cr-line";
          inner.className = "cr-line__i";
          inner.textContent = r.words.join("");
          line.appendChild(inner);
          el.appendChild(line);
          return inner;
        });
      }
      // accent hairline after each key value; appended after the lines are split
      const parts = blocks.map((b) => ({
        kin: Array.from(b.querySelectorAll(".title, .dek, .val, .line")).map(splitLines),
        cue: Array.from(b.querySelectorAll(".meta, .lab, .note, .site")),
      }));
      blocks.forEach((b) => {
        const v = b.querySelector(".val");
        if (v) {
          const a = document.createElement("span");
          a.className = "accent";
          v.after(a);
        }
      });
      const tl = gsap.timeline({ paused: true });
      blocks.forEach((b) => {
        const a = b.querySelector(".accent");
        if (a) tl.set(a, { scaleX: 0 }, 0);
      });
      const IN = 1.1; // the site's reveal window
      function enter(i, t0) {
        const P = parts[i];
        tl.set(blocks[i], { opacity: 1 }, t0);
        P.kin.forEach((lines, k) => {
          const n = lines.length;
          lines.forEach((ln, j) => {
            const start = t0 + k * 0.08 * IN + (n > 1 ? (j / (n - 1)) * 0.62 * 0.5 * IN : 0);
            tl.fromTo(ln, { yPercent: 135 }, { yPercent: 0, duration: 0.38 * IN + 0.25, ease: "power2.out", immediateRender: false }, start);
          });
        });
        const acc = blocks[i].querySelector(".accent");
        if (acc) tl.fromTo(acc, { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.8, ease: "expo.out", immediateRender: false }, t0 + 0.75);
        P.cue.forEach((el, k) => {
          tl.fromTo(el, { opacity: 0, y: "2.4vh" }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t0 + 0.22 * IN + k * 0.06 * IN);
        });
      }
      function leave(i, t0) {
        const P = parts[i];
        P.kin.flat().forEach((ln, j) => tl.to(ln, { yPercent: -135, duration: 0.5, ease: "sine.in" }, t0 + j * 0.03));
        P.cue.forEach((el) => tl.to(el, { opacity: 0, duration: 0.45, ease: "sine.in" }, t0));
        const acc = blocks[i].querySelector(".accent");
        if (acc) tl.to(acc, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.45, ease: "sine.in" }, t0);
        tl.set(blocks[i], { opacity: 0 }, t0 + 0.8);
      }
      // Start states: every block hidden, every line below its mask
      blocks.forEach((b) => tl.set(b, { opacity: 0 }, 0));
      parts.forEach((P) => {
        P.kin.flat().forEach((ln) => tl.set(ln, { yPercent: 135 }, 0));
        P.cue.forEach((el) => tl.set(el, { opacity: 0 }, 0));
      });
      enter(0, 0.2);
      T.forEach((t0, i) => {
        leave(i, t0);
        enter(i + 1, t0 + (i === T.length - 1 ? 0.6 : i === 0 ? 0.7 : 0.8)); // closing title once the strokes have cleared the right // the new copy rises as the morph settles (end card a little earlier, to be read) // the copy arrives with the fish (end card a little earlier, to be read)
      });
      window.__timelines["copy"] = tl;
    })();
  </script>
